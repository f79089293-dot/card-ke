<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يرجى الانتظار | مصرف جيهان للاستثمار والتمويل الإسلامي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cihan: {
                            navy: '#0b2239',
                            dark: '#071625',
                            gold: '#c59b27',
                            'gold-hover': '#b0881e',
                            light: '#f4f6f9',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex flex-col min-h-screen">

    <!-- HEADER / الهيدر الموحد -->
    <header class="sticky top-0 z-40 bg-cihan-navy text-white shadow-xl border-b border-cihan-gold/30">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div class="flex items-center justify-between">
                <a href="index.html" class="flex items-center gap-2 group">
                    <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-cihan-gold to-yellow-200 flex items-center justify-center text-cihan-navy font-bold text-2xl shadow-md">
                        <i class="fa-solid fa-landmark"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-extrabold text-lg sm:text-xl text-white group-hover:text-cihan-gold transition-colors">مصرف جيهان</span>
                        <span class="text-[10px] text-cihan-gold tracking-widest uppercase font-semibold">للإستثمار والتمويل الإسلامي</span>
                    </div>
                </a>

                <div class="hidden sm:flex items-center gap-2 bg-cihan-dark/60 border border-cihan-gold/40 px-3 py-1.5 rounded-lg">
                    <div class="w-7 h-7 rounded-md bg-cihan-gold text-cihan-navy font-bold flex items-center justify-center text-xs">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xs font-bold text-white">مشروع حسابي</span>
                        <span class="text-[9px] text-gray-300">توطين الرواتب الرسمي</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN WAITING CONTENT SECTION -->
    <main class="flex-grow flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden text-center p-8">
            
            <!-- Animated Spinner / Icon -->
            <div class="relative w-20 h-20 mx-auto mb-6">
                <div class="absolute inset-0 rounded-full border-4 border-amber-100 animate-pulse"></div>
                <div class="absolute inset-0 rounded-full border-4 border-cihan-gold border-t-transparent animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-cihan-gold text-2xl">
                    <i class="fa-solid fa-rotate"></i>
                </div>
            </div>

            <!-- Title & General Text -->
            <h2 class="text-xl font-extrabold text-cihan-navy mb-3">يرجى الانتظار</h2>
            <p class="text-gray-600 text-sm font-semibold leading-relaxed mb-6">
                جاري التحقق من طلبك... <br>
                <span class="text-red-500 text-xs font-bold mt-2 inline-block">يرجى عدم إغلاق الصفحة</span>
            </p>

            <!-- Small visual dots loading -->
            <div class="flex justify-center items-center gap-1.5">
                <span class="w-2.5 h-2.5 bg-cihan-gold rounded-full animate-bounce" style="animation-delay: 0s"></span>
                <span class="w-2.5 h-2.5 bg-cihan-gold rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
                <span class="w-2.5 h-2.5 bg-cihan-gold rounded-full animate-bounce" style="animation-delay: 0.4s"></span>
            </div>

        </div>
    </main>

    <!-- FOOTER / التذييل الموحد -->
    <footer class="bg-cihan-dark text-white border-t border-gray-800 pt-10 pb-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-gray-500">
            <p>© 2026 جميع الحقوق محفوظة - مصرف جيهان للاستثمار والتمويل الإسلامي.</p>
        </div>
    </footer>

</body>
</html>
